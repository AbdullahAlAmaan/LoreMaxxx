services:
  db:
    image: postgis/postgis:14-3.4
    container_name: lifemax-db
    restart: unless-stopped
    ports:
      - '5433:5432'
    environment:
      POSTGRES_DB: lifemax
      POSTGRES_USER: lifemax
      POSTGRES_PASSWORD: lifemax_dev_2024
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/src/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./backend/src/db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U lifemax -d lifemax']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
