version: '3.8'

services:
  db:
    image: postgis/postgis:15-3.3
    container_name: loremaxxx_db
    environment:
      POSTGRES_DB: lifemax
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./backend/src/db/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lifemax"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
